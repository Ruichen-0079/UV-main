<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yuvi AgentBus · 任务编排</title>
  <link rel="icon" href="/icon.svg">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand"><img src="/icon.svg" alt=""> Yuvi AgentBus</div>
      <div class="counts" id="counts"></div>
      <div class="top-actions">
        <button class="btn" id="btn-needs" type="button">需要你处理</button>
        <button class="btn" id="btn-archived" type="button">显示已归档</button>
        <button class="btn" id="btn-sync" type="button">立即同步</button>
        <button class="btn primary" id="btn-new" type="button">新建任务</button>
      </div>
    </header>
    <div class="shell">
      <aside class="col" id="list-col">
        <h2>任务列表</h2>
        <div id="stream-list"></div>
      </aside>
      <main class="col main" id="main"></main>
      <aside class="col" id="bind-col">
        <h2>绑定与角色</h2>
        <div id="bindings"><div class="empty">请选择一个任务。</div></div>
      </aside>
    </div>
  </div>
  <div id="modal" class="modal-back hidden"></div>
  <div id="toast" class="toast hidden"></div>
  <script src="/app.js"></script>
</body>
</html>

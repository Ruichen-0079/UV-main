# Development-only infrastructure for AI Companion Runtime.
# Supports Docker Desktop on Windows and Docker Engine on Linux/WSL.
# This is not production desktop infrastructure.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: companion-postgres
    environment:
      POSTGRES_USER: yuvi
      POSTGRES_PASSWORD: yuvi_dev_password
      POSTGRES_DB: yuvi
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - companion-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yuvi -d yuvi"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: companion-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - companion-redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  nats:
    image: nats:2-alpine
    container_name: companion-nats
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - companion-nats-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  companion-postgres-data:
  companion-redis-data:
  companion-nats-data:

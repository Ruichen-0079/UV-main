# Development-only infrastructure for AI Companion Runtime.
# Intended for Docker Engine inside WSL/Linux. This is not production desktop infrastructure.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: companion-postgres
    environment:
      POSTGRES_USER: airi
      POSTGRES_PASSWORD: airi_dev_password
      POSTGRES_DB: companion
    ports:
      - "5432:5432"
    volumes:
      - companion-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airi -d companion"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: companion-redis
    ports:
      - "6379:6379"
    volumes:
      - companion-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2-alpine
    container_name: companion-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - companion-nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  companion-postgres-data:
  companion-redis-data:
  companion-nats-data:

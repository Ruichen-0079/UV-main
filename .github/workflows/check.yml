name: Check

# Linux-first CI authority. Windows validation and Windows desktop packaging
# are deferred and are not merge gates. Platform policy:
# docs/future/atoms/README.md

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        # postinstall builds apps/web/vendor/cubism-framework/dist from vendored TS
        # (root .gitignore ignores dist/; Cubism Core is never committed).

      - name: Ensure Cubism Framework dist
        run: pnpm prepare:cubism-framework

      - name: Type check
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Smoke
        run: pnpm smoke

name: Check

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        # postinstall builds apps/web/vendor/cubism-framework/dist from vendored TS
        # (root .gitignore ignores dist/; Cubism Core is never committed).

      - name: Ensure Cubism Framework dist
        run: pnpm prepare:cubism-framework

      - name: Type check
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: PowerShell syntax
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Get-ChildItem scripts -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }
              throw "PowerShell syntax validation failed."
            }
          }

      - name: Process ownership regression
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/test-process-ownership.ps1

      - name: Smoke
        if: matrix.os == 'ubuntu-latest'
        run: pnpm smoke

      - name: Desktop packaging prepare + clean-room smoke
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          pnpm desktop:package:prepare
          pnpm desktop:package:smoke
        env:
          # Allow Node zip cache between steps of the same job when present.
          YUVI_NODE_CACHE: ${{ runner.temp }}/yuvi-node-cache

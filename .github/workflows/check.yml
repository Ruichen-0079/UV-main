name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        # postinstall builds apps/web/vendor/cubism-framework/dist from vendored TS
        # (root .gitignore ignores dist/; Cubism Core is never committed).

      - name: Ensure Cubism Framework dist
        run: pnpm prepare:cubism-framework

      - name: Type check
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: PowerShell syntax
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Get-ChildItem scripts -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }
              throw "PowerShell syntax validation failed."
            }
          }

      - name: Process ownership regression
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/test-process-ownership.ps1

      - name: Smoke
        if: matrix.os == 'ubuntu-latest'
        run: pnpm smoke

  desktop-windows-package:
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Configure Git line endings
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert clean checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path node_modules) { throw "node_modules must not exist before fresh install" }
          if (Test-Path services/memory-mem0/.venv) { throw "Mem0 venv must not exist before fresh install" }
          foreach ($path in @("build", "apps/desktop/src-tauri/generated", "apps/desktop/src-tauri/target")) {
            if (Test-Path $path) { throw "build artifact exists before fresh install: $path" }
          }
          $statusLines = @(git status --porcelain=v1 --untracked-files=no)
          if ($LASTEXITCODE -ne 0) {
            throw "git status failed"
          }

          if ($statusLines.Count -gt 0) {
            Write-Host "Tracked checkout changes:"
            $statusLines | ForEach-Object { Write-Host $_ }

            Write-Host "Changed paths:"
            git diff --name-only

            Write-Host "Diff stats:"
            git diff --numstat

            Write-Host "Git line-ending configuration:"
            git config --show-origin --get core.autocrlf
            git config --show-origin --get core.eol

            throw "checkout contains tracked modifications"
          }

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip
          cache-dependency-path: services/memory-mem0/requirements.txt

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
          components: rustfmt

      # Cache cargo registry + dependency artifacts for apps/desktop/src-tauri.
      # Key includes rustc, Cargo.lock/Cargo.toml, and compiler env. Workspace
      # crates and the NSIS installer are not restored from cache.
      - name: Cache Rust / Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          shared-key: desktop-windows-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify package toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pnpmVersion = (pnpm --version).Trim()
          if ($pnpmVersion -ne "9.15.4") { throw "expected pnpm 9.15.4, found $pnpmVersion" }
          pnpm exec esbuild --version

      - name: Install Mem0 Python dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --disable-pip-version-check --no-input -r services/memory-mem0/requirements.txt
          "YUVI_PYTHON311=$((Get-Command python).Source)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $pythonVersion = (python --version 2>&1).ToString().Trim()
          if ($pythonVersion -notmatch '^Python 3\.11\.') { throw "expected Python 3.11.x, found $pythonVersion" }
          $pythonVersion
          $pyinstallerVersion = ((python -m pip show pyinstaller | Select-String '^Version:').ToString() -split ':', 2)[1].Trim()
          if ($pyinstallerVersion -ne "6.13.0") { throw "expected PyInstaller 6.13.0, found $pyinstallerVersion" }
          $mem0Version = ((python -m pip show mem0ai | Select-String '^Version:').ToString() -split ':', 2)[1].Trim()
          if ($mem0Version -ne "0.1.107") { throw "expected mem0ai 0.1.107, found $mem0Version" }
          python -m pip show pyinstaller
          python -m pip show mem0ai
          python -m pip check

      - name: Prepare packaged desktop resources
        run: pnpm desktop:package:prepare

      - name: Rust format gate
        shell: pwsh
        run: rustfmt --check apps/desktop/src-tauri/src/config/tests.rs

      - name: Rust check and tests
        working-directory: apps/desktop/src-tauri
        run: |
          cargo check
          cargo test

      - name: Credential Manager round-trip
        working-directory: apps/desktop/src-tauri
        shell: pwsh
        env:
          YUVI_RUN_WINDOWS_CREDENTIAL_TEST: "1"
        run: cargo test platform_credential_manager_roundtrip_and_config_push -- --exact --nocapture --test-threads=1

      - name: Packaging tests
        run: |
          pnpm desktop:installer:test
          pnpm desktop:package:test

      - name: Build NSIS installer
        shell: pwsh
        env:
          YUVI_NODE_CACHE: ${{ runner.temp }}/yuvi-node-cache
        run: pnpm desktop:build:windows

      - name: Direct installer smoke
        shell: pwsh
        env:
          YUVI_NODE_CACHE: ${{ runner.temp }}/yuvi-node-cache
        run: pnpm desktop:installer:smoke

      - name: Tauri application smoke
        shell: pwsh
        env:
          CI: "true"
          YUVI_ALLOW_TAURI_APP_SMOKE: "1"
        run: pnpm desktop:installer:smoke --launch-app

      - name: Prepare installer artifact
        id: installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $nsis = Join-Path $env:GITHUB_WORKSPACE "apps/desktop/src-tauri/target/release/bundle/nsis"
          $candidates = @(Get-ChildItem $nsis -File -Filter "YUVI Companion_*_x64-setup.exe" | Sort-Object LastWriteTime -Descending)
          if ($candidates.Count -ne 1) { throw "expected exactly one NSIS installer, found $($candidates.Count)" }
          $installer = $candidates[0]
          $artifact = Join-Path $env:RUNNER_TEMP "yuvi-windows-artifacts"
          New-Item -ItemType Directory -Force $artifact | Out-Null
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content (Join-Path $artifact "installer-sha256.txt") -Encoding ascii
          Copy-Item $installer.FullName (Join-Path $artifact $installer.Name)
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "apps/desktop/src-tauri/generated/win32-x64/packaging-info.json") (Join-Path $artifact "packaging-info.json")
          "path=$($installer.FullName)" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "artifact=$artifact" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload Windows packaging artifact
        uses: actions/upload-artifact@v4
        with:
          name: yuvi-windows-nsis-${{ github.sha }}
          path: ${{ steps.installer.outputs.artifact }}
          retention-days: 7
          if-no-files-found: error

      - name: Final cleanliness
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git diff --exit-code -- Cargo.lock pnpm-lock.yaml
          $statusLines = @(git status --porcelain=v1 --untracked-files=no)
          if ($LASTEXITCODE -ne 0) {
            throw "git status failed during final cleanliness"
          }

          if ($statusLines.Count -gt 0) {
            Write-Host "Tracked changes:"
            $statusLines | ForEach-Object { Write-Host $_ }

            Write-Host "Changed paths:"
            git diff --name-only

            Write-Host "Diff numstat:"
            git diff --numstat

            Write-Host "Diff stat:"
            git diff --stat

            throw "tracked files changed during packaging job"
          }
          $tempRoot = [IO.Path]::GetTempPath()
          $residual = Get-CimInstance Win32_Process | Where-Object {
            $_.CommandLine -and (
              $_.CommandLine.Contains("yuvi-installer-smoke-") -or
              $_.CommandLine.Contains("yuvi-desktop-supervisor") -or
              $_.CommandLine.Contains("yuvi-runtime-server") -or
              $_.CommandLine.Contains("yuvi-mem0.exe")
            )
          }
          if ($residual) { throw "packaged smoke process remains: $($residual.ProcessId -join ',')" }

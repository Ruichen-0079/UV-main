name: P7-8E Finish

on:
  push:
    branches:
      - agentbus/p7-8e-settings-state-truth

permissions:
  contents: write

jobs:
  finish-linux:
    if: ${{ !contains(github.event.head_commit.message, 'finish P7-8E settings truth') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch saved/effective baseline handling
        shell: python
        run: |
          from pathlib import Path

          path = Path("apps/web/src/App.tsx")
          text = path.read_text()

          save_and_apply = '''      setSaveResult({
        mode: "save-and-apply",
        changedKeys: response.changedKeys,
        restartRequired: response.restartRequired
      });
      setSettingsState("reloading");'''
          save_and_apply_replacement = '''      setSaveResult({
        mode: "save-and-apply",
        changedKeys: response.changedKeys,
        restartRequired: response.restartRequired
      });
      const savedForm = settingsFormFromResponse(response.settings);
      updateBaselineAfterSave(snapshot, savedForm);
      setSettingsState("reloading");'''
          if text.count(save_and_apply) != 1:
              raise SystemExit("save-and-apply anchor mismatch")
          text = text.replace(save_and_apply, save_and_apply_replacement)

          comparison = '''      const comparison = compareSettingsForms(snapshot, refreshedForm, new Set(settingsSecretKeys));'''
          comparison_replacement = '''      const comparison = compareSettingsForms(
        savedForm,
        refreshedForm,
        new Set(settingsSecretKeys)
      );'''
          if text.count(comparison) != 1:
              raise SystemExit("comparison anchor mismatch")
          text = text.replace(comparison, comparison_replacement)

          save_only = '''      setSaveResult({
        mode: "save-only",
        changedKeys: response.changedKeys,
        restartRequired: response.restartRequired
      });
      const refreshed = await settings.refresh();'''
          save_only_replacement = '''      setSaveResult({
        mode: "save-only",
        changedKeys: response.changedKeys,
        restartRequired: response.restartRequired
      });
      updateBaselineAfterSave(snapshot, settingsFormFromResponse(response.settings));
      const refreshed = await settings.refresh();'''
          if text.count(save_only) != 1:
              raise SystemExit("save-only anchor mismatch")
          text = text.replace(save_only, save_only_replacement)

          path.write_text(text)

      - name: Remove temporary workflow from final tree
        run: git rm .github/workflows/p7-8e-finish.yml

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Cubism Framework
        run: pnpm prepare:cubism-framework

      - name: Focused settings-state tests
        run: pnpm --filter @companion/web exec vitest run src/settings-state.test.ts

      - name: Web TypeScript check
        run: pnpm --filter @companion/web check

      - name: Web tests
        run: pnpm --filter @companion/web test

      - name: Web build
        run: pnpm --filter @companion/web build

      - name: Root check
        run: pnpm check

      - name: Root tests
        run: pnpm test

      - name: Root build
        run: pnpm build

      - name: Diff check
        run: git diff --check

      - name: Commit validated repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/App.tsx .github/workflows/p7-8e-finish.yml
          git commit -m "fix(web): finish P7-8E settings truth"
          git push origin HEAD:agentbus/p7-8e-settings-state-truth

name: A12 Lock Refresh

on:
  push:
    branches:
      - atom/a12-v0.1.2-release-gate
    paths:
      - .github/workflows/a12-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: atom/a12-v0.1.2-release-gate
      - uses: dtolnay/rust-toolchain@stable
      - name: Refresh workspace lock
        working-directory: apps/desktop/src-tauri
        run: cargo update --workspace
      - name: Verify bounded diff
        run: |
          git diff --exit-code -- . ':(exclude)apps/desktop/src-tauri/Cargo.lock'
          test "$(git diff --numstat -- apps/desktop/src-tauri/Cargo.lock | awk '{print $1+$2}')" = "2"
          git diff -- apps/desktop/src-tauri/Cargo.lock | grep -F -- '-version = "0.1.1"'
          git diff -- apps/desktop/src-tauri/Cargo.lock | grep -F -- '+version = "0.1.2"'
      - name: Commit refreshed lock
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/desktop/src-tauri/Cargo.lock
          git commit -m "chore: refresh Cargo lock for v0.1.2"
          git push origin HEAD:atom/a12-v0.1.2-release-gate
